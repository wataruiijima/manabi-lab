<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>キーインベーダー・ラボ Phaser版</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="gameRoot"></div>

    <div id="startOverlay" class="start-overlay" aria-hidden="false">
      <div class="start-panel">
        <p class="start-kicker">typing kids lab</p>
        <h2>キーインベーダー・ラボ</h2>
        <p>おおきなスタートで はじめよう</p>
        <button id="startButton" class="start-button" type="button">START</button>
        <button id="openSettingsButton" class="settings-button" type="button">ほごしゃ せってい</button>
      </div>
    </div>

    <div id="settingsOverlay" class="settings-overlay hidden" aria-hidden="true">
      <div class="settings-panel">
        <h3>ほごしゃ せってい</h3>
        <label>キーボード配列
          <select id="layoutSelect">
            <option value="JIS">JIS（日本語）</option>
            <option value="US">US</option>
          </select>
        </label>
        <label><input id="toggleFunctionRow" type="checkbox" checked /> F1〜F12 を表示</label>
        <label><input id="toggleNumberRow" type="checkbox" checked /> 数字キー列を表示</label>
        <div class="settings-actions">
          <button id="applySettingsButton" type="button">はんえい</button>
          <button id="closeSettingsButton" type="button">とじる</button>
        </div>
      </div>
    </div>

    <div id="gateOverlay" class="gate-overlay hidden" aria-hidden="true">
      <div class="gate-panel">
        <p class="gate-kicker">ほごしゃ かくにん</p>
        <h3 id="gateQuestion">3 × 4 = ?</h3>
        <p class="gate-description">せいかいを にゅうりょく してください</p>
        <input id="gateAnswerInput" class="gate-input" type="number" inputmode="numeric" min="0" max="99" />
        <p id="gateFeedback" class="gate-feedback">かけざんの こたえを いれてください</p>
        <div class="settings-actions">
          <button id="gateSubmitButton" type="button">かくにん</button>
          <button id="gateCancelButton" class="gate-cancel" type="button">キャンセル</button>
        </div>
      </div>
    </div>

    <div id="retryOverlay" class="retry-overlay hidden" aria-hidden="true">
      <div class="retry-panel">
        <p class="retry-kicker">しすてむ ていし</p>
        <h2>げーむおーばー</h2>
        <p id="retryScoreText">すこあ 0 / たおしたかず 0</p>
        <button id="retryButton" type="button">もういちど</button>
      </div>
    </div>

    <div id="clearOverlay" class="clear-overlay hidden" aria-hidden="true">
      <div class="clear-panel">
        <p class="clear-kicker">みっしょん かんりょう</p>
        <h2>くりあ！</h2>
        <p id="clearScoreText">すこあ 0 / たおしたかず 0</p>
        <button id="clearButton" type="button">もういちど</button>
      </div>
    </div>

    <div id="hudLayer" class="hud-layer">
      <header class="hud-top">
        <h1>キーインベーダー・ラボ</h1>
        <div class="stats-grid">
          <span class="stat-chip">すこあ <b id="score">0</b></span>
          <span class="stat-chip">れんぞく <b id="combo">0</b></span>
          <span class="stat-chip">かんぺきれんぞく <b id="perfectStreak">0</b></span>
          <span class="stat-chip">たおしたかず <b id="wave">0</b></span>
        </div>
      </header>

      <section class="target-panel" aria-live="polite">
        <p id="targetMode" class="target-mode">ひとつ うつ</p>
        <strong id="targetKey">A</strong>
        <span id="feedback">キーを押して攻撃！</span>
      </section>

      <section class="bottom-ui">
        <div class="gauge-line">
          <div class="gauge-block">
            <span>にゅうりょく きけんど</span>
            <div class="gauge"><div id="inputGaugeFill" class="gauge-fill input"></div></div>
          </div>
          <div class="gauge-block">
            <span>たいりょく</span>
            <div class="gauge"><div id="playerHpFill" class="gauge-fill hp"></div></div>
          </div>
        </div>
        <div class="keyboard-inline">
          <div class="keyboard-shell">
            <div id="keyboard" class="keyboard"></div>
          </div>
        </div>
        <div class="log-inline">にゅうりょく: <span id="typedLog">-</span></div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
