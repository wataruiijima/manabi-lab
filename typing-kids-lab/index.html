<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>キーインベーダー・ラボ Phaser版</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="gameRoot"></div>

    <div class="hud-layer">
      <header class="hud-top">
        <h1>キーインベーダー・ラボ</h1>
        <div class="stats">
          <span>SCORE <b id="score">0</b></span>
          <span>COMBO <b id="combo">0</b></span>
          <span>WAVE <b id="wave">1</b></span>
        </div>
      </header>

      <section class="mission-line">
        <span>TARGET</span>
        <strong id="targetKey">A</strong>
        <span id="feedback">キーを押して攻撃！</span>
      </section>

      <section class="bottom-ui">
        <div class="log-inline">Input: <span id="typedLog">-</span></div>
        <div class="keyboard-inline">
          <div class="keyboard-shell">
            <div id="keyboard" class="keyboard"></div>
          </div>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
