<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>キーぼうけんラボ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>キーぼうけんラボ</h1>
      <div class="scoreboard">
        <div>Score: <span id="score">0</span></div>
        <div>Combo: <span id="combo">0</span></div>
      </div>
    </header>

    <main class="layout">
      <section class="battlefield">
        <div class="mission">おだい: <span id="targetKey">A</span> をねらおう！</div>
        <div id="feedback" class="feedback">START!</div>
        <div id="enemy" class="enemy">👾</div>
        <div id="projectiles" class="projectiles" aria-live="polite"></div>
      </section>

      <section class="sidepanel">
        <div class="panel-block">
          <h2>さいきんの入力</h2>
          <div id="typedLog" class="typed-log">-</div>
        </div>
        <div class="panel-block">
          <h2>ステータス</h2>
          <ul class="legend">
            <li><span class="dot perfect"></span> Perfect（お題どおり）</li>
            <li><span class="dot good"></span> Good（となりのキー）</li>
            <li><span class="dot miss"></span> Miss（それ以外）</li>
          </ul>
        </div>
      </section>

      <section class="keyboard-wrap">
        <h2>キーボード</h2>
        <div id="keyboard" class="keyboard"></div>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
