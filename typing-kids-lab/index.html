<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>キーインベーダー・ラボ Phaser版</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="gameRoot"></div>

    <div id="retryOverlay" class="retry-overlay hidden" aria-hidden="true">
      <div class="retry-panel">
        <p class="retry-kicker">しすてむ ていし</p>
        <h2>げーむおーばー</h2>
        <p id="retryScoreText">すこあ 0 / たおしたかず 0</p>
        <button id="retryButton" type="button">もういちど</button>
      </div>
    </div>

    <div id="clearOverlay" class="clear-overlay hidden" aria-hidden="true">
      <div class="clear-panel">
        <p class="clear-kicker">みっしょん かんりょう</p>
        <h2>くりあ！</h2>
        <p id="clearScoreText">すこあ 0 / たおしたかず 0</p>
        <button id="clearButton" type="button">もういちど</button>
      </div>
    </div>

    <div class="hud-layer">
      <header class="hud-top">
        <h1>キーインベーダー・ラボ</h1>
        <div class="stats-grid">
          <span class="stat-chip">すこあ <b id="score">0</b></span>
          <span class="stat-chip">れんぞく <b id="combo">0</b></span>
          <span class="stat-chip">かんぺきれんぞく <b id="perfectStreak">0</b></span>
          <span class="stat-chip">たおしたかず <b id="wave">0</b></span>
        </div>
      </header>

      <section class="target-panel" aria-live="polite">
        <p id="targetMode" class="target-mode">ひとつ うつ</p>
        <strong id="targetKey">A</strong>
        <span id="feedback">キーを押して攻撃！</span>
      </section>

      <section class="gauge-line">
        <div class="gauge-block">
          <span>にゅうりょく きけんど</span>
          <div class="gauge"><div id="inputGaugeFill" class="gauge-fill input"></div></div>
        </div>
        <div class="gauge-block">
          <span>たいりょく</span>
          <div class="gauge"><div id="playerHpFill" class="gauge-fill hp"></div></div>
        </div>
      </section>

      <section class="bottom-ui">
        <div class="log-inline">にゅうりょく: <span id="typedLog">-</span></div>
        <div class="keyboard-inline">
          <div class="keyboard-shell">
            <div id="keyboard" class="keyboard"></div>
          </div>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
